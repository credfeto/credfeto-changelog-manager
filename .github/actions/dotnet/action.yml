--- # Build and deploy packages
# Maintain in repo: funfair-server-template
name: 'Build Dotnet'
description: 'Builds and deploys the source'
inputs:
  # General
  production-build:
    description: 'Whether to build a production build'
    required: true

  # NUGET
  nuget-pack:
    description: 'Whether to pack packages with feeds'
    required: false
  nuget-feed:
    description: 'Nuget feed to push packages to'
    required: false
  nuget-symbol-feed:
    description: 'Nuget feed to push packages symbols to'
    required: false
  nuget-api-key:
    description: 'API key to authenticate when pushing packages'
    required: false
  sleet-config:
    description: 'Sleet config file'
    required: false
  sleet-feed:
    description: 'Sleet feed to push packages to'
    required: false
  dotnet-docker-platform:
    description: 'Dotnet docker platform (e.g. linux-arm64)'
    required: false

  # General
  build-version:
    description: 'Build version'
    required: true

  release:
    description: 'Is this a release build'
    required: true

  release-notes:
    description: 'Release notes'
    required: false

  build-sql:
    description: 'Whether to build SQL DB'
    required: true
  db-folder:
    description: 'Folder where SQL Files live'
    required: false

  # GENERAL
  github-token:
    description: 'Github Token'
    required: true

  # DEPLOYMENT
  project-to-publish:
    description: 'Package (root) to deploy'
    required: false

runs:
  using: "composite"
  steps:

    ############################################################################################################
    # DOTNET BUILD
    ############################################################################################################

    - name: "Dotnet: Define Master build settings"
      if: inputs.release == 'false'
      working-directory: ${{github.workspace}}/src
      shell: bash
      run: echo "DOTNET_RELEASE_DEFINES=-p:IsProduction=false" >> "$GITHUB_ENV"

    - name: "Dotnet: Define Release build settings"
      if: inputs.release == 'true'
      working-directory: ${{github.workspace}}/src
      shell: bash
      run: echo "DOTNET_RELEASE_DEFINES=-p:IsProduction=True" >> "$GITHUB_ENV"

    - name: "Dotnet: Run build check"
      if: (!endsWith(github.repository, 'funfair-dotnet-build-check')) && (!endsWith(github.repository, '-template'))
      uses: ./.github/actions/dotnet-build-check
      with:
        release: ${{inputs.release}}

    - name: "Dotnet: Override code analysis rules"
      if: "!endsWith(github.repository, '-template')"
      uses: ./.github/actions/dotnet-code-analysis-override
      with:
        release: ${{inputs.release}}

    - name: "Dotnet: Restore packages"
      working-directory: ${{github.workspace}}/src
      shell: bash
      run: |
        dotnet restore \
              --warnaserror \
              -nodeReuse:False \
              -p:NoWarn=MSB4241 \
              -p:SuppressNETCoreSdkPreviewMessage=true || \
        dotnet restore \
              --warnaserror \
              -nodeReuse:False \
              -p:NoWarn=MSB4241 \
              -p:SuppressNETCoreSdkPreviewMessage=true \
              --ignore-failed-sources || \
        dotnet restore \
              --warnaserror \
              -nodeReuse:False \
              -p:NoWarn=MSB4241 \
              -p:SuppressNETCoreSdkPreviewMessage=true \
              --ignore-failed-sources

    - name: "Dotnet: Build"
      working-directory: ${{github.workspace}}/src
      shell: bash
      run: |
        dotnet build \
                  --warnaserror \
                  --no-restore \
                  --configuration Release \
                  "-p:ContinuousIntegrationBuild=true" \
                  "-p:EnableSarif=True" \
                  "-p:IsProduction=${{inputs.production-build}}" \
                  "-p:NoWarn=MSB4241" \
                  "-p:SuppressNETCoreSdkPreviewMessage=true" \
                  "-p:Version=${{inputs.build-version}}" \
                  -nodeReuse:False \
                  ${{env.DOTNET_RELEASE_DEFINES}}
      env:
        ReleaseNotes: ${{inputs.release-notes}}

    ## RUN TESTS
    - name: "Dotnet: Test"
      working-directory: ${{github.workspace}}/src
      shell: bash
      run: |
        dotnet test \
                  --configuration Release \
                  --long-running 10 \
                  --filter-not-namespace "*.Benchmark.Tests" \
                  --filter-not-namespace "*.Benchmark.Tests.*" \
                  --filter-not-namespace "*.Integration.Tests" \
                  --filter-not-namespace "*.Integration.Tests.*" \
                  --parallel-algorithm aggressive \
                  --ignore-exit-code 8 \
                  --report-github \
                  "-p:ContinuousIntegrationBuild=true" \
                  "-p:IsProduction=${{inputs.production-build}}" \
                  "-p:NoWarn=MSB4241" \
                  "-p:Optimize=true" \
                  "-p:SuppressNETCoreSdkPreviewMessage=true" \
                  "-p:Version=${{inputs.build-version}}"
      env:
        ReleaseNotes: ${{inputs.release-notes}}

    # ############################################################################################################
    # # DATABASE BUILD
    # ############################################################################################################
    - name: "SQL: Build"
      if: inputs.build-sql == 'true'
      uses: ./.github/actions/sql
      with:
        db-folder: ${{inputs.db-folder}}
        github-token: ${{inputs.github-token}}

    ############################################################################################################
    # Publish ready for deploy
    ############################################################################################################

    - name: "Dotnet: Publish Packages"
      if: inputs.project-to-publish != ''
      uses: ./.github/actions/dotnet-publish
      with:
        production-build: ${{inputs.production-build}}
        build-version: ${{inputs.build-version}}
        release-notes: ${{inputs.release-notes}}
        platform: ${{inputs.dotnet-docker-platform}}
        project-to-publish: ${{inputs.project-to-publish}}

    ############################################################################################################
    # DOTNET PUSH TO NUGET
    ############################################################################################################
    - name: "Dotnet: Pack tool"
      if: inputs.nuget-pack == 'true'
      working-directory: ${{github.workspace}}/src
      shell: bash
      run: |
        dotnet pack \
                  --warnaserror \
                  --configuration Release \
                  "-p:Version=${{inputs.build-version}}" \
                  "-p:IsProduction=${{inputs.production-build}}" \
                  "-p:IncludeSymbols=False" \
                  --no-restore \
                  -nodeReuse:False \
                  "-p:NoWarn=MSB4241" \
                  "-p:ContinuousIntegrationBuild=true"
      env:
        ReleaseNotes: ${{inputs.release-notes}}

    - name: "Dotnet: Copy packed to dist"
      if: inputs.nuget-pack == 'true'
      shell: bash
      run: |
        shopt -s globstar
        cp **/*.nupkg "${{github.workspace}}/dist"
      working-directory: ${{github.workspace}}/src

    - name: "Dotnet: Publish Packages to Nuget (With integrated symbol feed)"
      if: |-
        inputs.nuget-api-key != '' &&
        inputs.nuget-api-key != 'SLEET' &&
        inputs.nuget-pack == 'true' &&
        (inputs.nuget-symbol-feed == '' || inputs.nuget-symbol-feed == ' ')
      uses: ./.github/actions/nuget-push-integrated-symbol-feed
      with:
        nuget-feed: ${{inputs.nuget-feed}}
        nuget-api-key: ${{inputs.nuget-api-key}}

    - name: "Dotnet: Publish Packages to Nuget (With separate symbol feed)"
      if: |-
        inputs.nuget-api-key != '' &&
        inputs.nuget-api-key != 'SLEET' &&
        inputs.nuget-pack == 'true' &&
        !(inputs.nuget-symbol-feed == '' || inputs.nuget-symbol-feed == ' ')
      uses: ./.github/actions/nuget-push-separate-symbol-feed
      with:
        nuget-feed: ${{inputs.nuget-feed}}
        nuget-symbol-feed: ${{inputs.nuget-symbol-feed}}
        nuget-api-key: ${{inputs.nuget-api-key}}

    - name: "Dotnet: Publish Packages using sleet"
      if: |-
        inputs.nuget-api-key == 'SLEET' &&
        inputs.nuget-pack == 'true'
      uses: ./.github/actions/sleet
      with:
        sleet-config: ${{ inputs.sleet-config }}
        sleet-feed: ${{inputs.sleet-feed}}
